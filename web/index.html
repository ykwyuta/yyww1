<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#132027" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="欧州大戦" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="description" content="欧州大戦 1914–1919。第一次世界大戦の欧州を舞台にしたリアルタイムストラテジー（ブラウザ版）" />
    <title>欧州大戦 1914–1919</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #132027; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      body { touch-action: none; }
      /* 画面の縁からの余白（指で操作する端末では、ノッチ・ホームバー・戻るジェスチャーの領域を避ける） */
      :root { --sl: 0px; --sr: 0px; --st: 0px; --sb: 0px; }
      :root.touch { --sl: max(env(safe-area-inset-left), 14px); --sr: max(env(safe-area-inset-right), 14px);
          --st: max(env(safe-area-inset-top), 10px); --sb: max(env(safe-area-inset-bottom), 14px); }
      canvas { position: fixed; left: var(--sl); top: var(--st); display: block;
        width: calc(100vw - var(--sl) - var(--sr)); height: calc(100vh - var(--st) - var(--sb)); height: calc(100dvh - var(--st) - var(--sb)); }
      #ui { touch-action: none; outline: none; }
      /* スマートフォンを縦に持っているときは横向きを促す */
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: rgba(19, 32, 39, 0.97); color: #ece8d8; font: 18px "Noto Sans JP", sans-serif; text-align: center; padding: 24px; }
      #rotate .phone { width: 44px; height: 76px; border: 3px solid #b8b08a; border-radius: 8px; animation: rot 2.4s ease-in-out infinite; }
      @keyframes rot { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
      /* 縦持ちでは文字が小さくなりすぎるので、横向きを促す（スマートフォン・タブレットとも） */
      @media (orientation: portrait) { :root.touch #rotate { display: flex; } }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #ece8d8; font: 18px "Yu Gothic UI", "Noto Sans JP", sans-serif; background: #132027; gap: 12px; }
      #loading h1 { margin: 0; padding: 24px 32px; border-top: 1px solid #78847e; border-bottom: 1px solid #78847e; font-size: clamp(26px, 5vw, 40px); letter-spacing: 0.3em; color: #ece8d8; }
      #loading::before { content: "THE GREAT WAR / 1914–1919"; letter-spacing: .24em; color: #b8b08a; font-size: 12px; margin-bottom: 18px; }
      #loading.hidden { display: none; }
      #loading .err { color: #ff8a7a; max-width: 80vw; white-space: pre-wrap; font-size: 14px; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <canvas id="ui" tabindex="0"></canvas>
    <div id="rotate"><div class="phone"></div><div id="rotate-msg">画面を横向きにしてお遊びください</div></div>
    <div id="loading"><h1>欧州大戦</h1><div id="loading-msg">読み込み中…</div></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
